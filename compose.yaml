name: ${COMPOSE_PROJECT_NAME:-videogame-platform}

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set APPLICATION_DB_PASSWORD in .env}
      APPLICATION_MIGRATION_DB_PASSWORD: ${APPLICATION_MIGRATION_DB_PASSWORD:?Set APPLICATION_MIGRATION_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/videogame_keycloak
      KC_DB_USERNAME: videogame_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8180}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?Set KEYCLOAK_BFF_CLIENT_SECRET in .env}
      LOCAL_TEST_USER_USERNAME: ${LOCAL_TEST_USER_USERNAME:-local-user}
      LOCAL_TEST_USER_PASSWORD: ${LOCAL_TEST_USER_PASSWORD:?Set LOCAL_TEST_USER_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8180}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q 'HTTP/1.1 200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s

  application:
    profiles: ["full"]
    image: videogame-platform/application:${APPLICATION_VERSION:?Use scripts/local-dependencies.sh application so the version is derived from Maven}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APPLICATION_VERSION: ${APPLICATION_VERSION:?Use scripts/local-dependencies.sh application so the version is derived from Maven}
        SOURCE_REVISION: ${SOURCE_REVISION:-local-development}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/rubhern/videogame-platform}
    # The packaged application shares one local application-configuration source with direct
    # spring-boot:run: backend/.env. The environment block below overrides ONLY where the
    # container topology genuinely differs from host execution, plus shared generated secrets
    # provisioned by root .env. Application tuning (catalogue windows, IGDB, timeouts, session,
    # logging, telemetry) lives solely in backend/.env and must not be duplicated here.
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Mandatory packaged runtime profile (host default leaves this empty).
      SPRING_PROFILES_ACTIVE: oidc
      # Container network addresses instead of host loopback.
      APPLICATION_DB_URL: jdbc:postgresql://postgres:5432/videogame_platform
      APPLICATION_MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/videogame_platform
      # The packaged runtime applies migrations on startup; host execution opts in explicitly.
      APPLICATION_FLYWAY_ENABLED: "true"
      # Bind management to all container interfaces so the loopback port publish below reaches it.
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      # Internal server-to-server Keycloak endpoints (browser-facing issuer stays in backend/.env).
      OIDC_TOKEN_URI: http://keycloak:8080/realms/videogame-platform/protocol/openid-connect/token
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/videogame-platform/protocol/openid-connect/certs
      OIDC_USER_INFO_URI: http://keycloak:8080/realms/videogame-platform/protocol/openid-connect/userinfo
      # Shared generated secrets provisioned by root .env; must match the infrastructure it created.
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:?Set APPLICATION_DB_PASSWORD in .env}
      APPLICATION_MIGRATION_DB_PASSWORD: ${APPLICATION_MIGRATION_DB_PASSWORD:?Set APPLICATION_MIGRATION_DB_PASSWORD in .env}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?Set KEYCLOAK_BFF_CLIENT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    cpus: 0.5
    stop_grace_period: 30s

volumes:
  postgres-data:
