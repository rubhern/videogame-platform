name: Maven dependency submission

on:
  push:
    branches:
      - main
    paths:
      - pom.xml
      - backend/pom.xml
      - tools/igdb-poc/pom.xml
      - mvnw
      - .mvn/wrapper/**
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

concurrency:
  group: maven-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  submit-maven-graphs:
    name: Submit ${{ matrix.graph }} Maven graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: backend-reactor
            correlator: maven-backend-reactor
            pom: pom.xml
          - graph: igdb-poc
            correlator: maven-igdb-poc
            pom: tools/igdb-poc/pom.xml
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Maven cache: this graph resolves only POMs, and saving that first would leave the
      # build jobs restoring an almost empty repository under the same key.
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Bootstrap the pinned Maven Wrapper
        env:
          MVNW_VERBOSE: "true"
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --batch-mode --no-transfer-progress --version; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Unable to bootstrap the pinned Maven distribution."
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Resolve and submit the complete Maven dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          correlator: ${{ matrix.correlator }}
          # Resolve the root wrapper for both graphs, including the standalone PoC.
          directory: ${{ github.workspace }}
          maven-args: -f ${{ matrix.pom }}
