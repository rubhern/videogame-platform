name: Maven dependency submission

on:
  push:
    branches:
      - main
    paths:
      - pom.xml
      - backend/pom.xml
      - tools/igdb-poc/pom.xml
      - mvnw
      - .mvn/wrapper/**
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

concurrency:
  group: maven-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  submit-maven-graphs:
    name: Submit ${{ matrix.graph }} Maven graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: backend-reactor
            correlator: maven-backend-reactor
            directory: .
          - graph: igdb-poc
            correlator: maven-igdb-poc
            directory: tools/igdb-poc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Maven cache: this graph resolves only POMs, and saving that first would leave the
      # build jobs restoring an almost empty repository under the same key.
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Resolve and submit the complete Maven dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          correlator: ${{ matrix.correlator }}
          # The action needs an absolute root path so it executes ./mvnw rather
          # than looking for a bare mvnw command on PATH.
          directory: ${{ matrix.directory == '.' && github.workspace || matrix.directory }}
