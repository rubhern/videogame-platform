name: Walking-skeleton build and verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  detect-changes:
    name: Detect affected CI areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      documentation: ${{ steps.changes.outputs.documentation }}
      openapi: ${{ steps.changes.outputs.openapi }}
      frontend: ${{ steps.changes.outputs.frontend }}
      browser: ${{ steps.changes.outputs.browser }}
      backend: ${{ steps.changes.outputs.backend }}
      migrations: ${{ steps.changes.outputs.migrations }}
      identity: ${{ steps.changes.outputs.identity }}
      provider_fixtures: ${{ steps.changes.outputs.provider_fixtures }}
      container: ${{ steps.changes.outputs.container }}
      production_runtime: ${{ steps.changes.outputs.production_runtime }}
      dependency_images: ${{ steps.changes.outputs.dependency_images }}
      build: ${{ steps.changes.outputs.build }}
      ci: ${{ steps.changes.outputs.ci }}
      sonar: ${{ steps.changes.outputs.sonar }}
    steps:
      - name: Check out the analyzed revision with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors in the reviewed change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          whitespace_paths=(
            .
            ':(exclude).agents/skills/vercel-composition-patterns/**'
            ':(exclude).agents/skills/vercel-react-best-practices/**'
          )
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --check --root --no-commit-id --recursive "$HEAD_SHA" -- "${whitespace_paths[@]}"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA" -- "${whitespace_paths[@]}"
          fi

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'push' }}
        run: |
          arguments=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$FULL_VALIDATION" == "true" ]]; then
            arguments+=(--full)
          fi
          bash scripts/detect-ci-changes.sh "${arguments[@]}" >>"$GITHUB_OUTPUT"

      - name: Test CI change classification and result handling
        if: ${{ steps.changes.outputs.ci == 'true' }}
        run: bash scripts/test-ci-change-detection.sh

  documentation-contracts:
    name: Documentation and API contracts
    if: ${{ needs.detect-changes.outputs.documentation == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        if: ${{ needs.detect-changes.outputs.ci == 'true' }}
        run: bash scripts/validate-actions.sh

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm dependencies
        if: ${{ needs.detect-changes.outputs.openapi == 'true' }}
        run: npm ci --ignore-scripts

      - name: Validate documentation
        run: bash scripts/validate-docs.sh

      - name: Install locked portal dependencies
        run: npm ci --prefix documentation --ignore-scripts

      - name: Audit portal dependency security
        run: npm audit --prefix documentation --audit-level=high

      - name: Install portal browser
        working-directory: documentation
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Validate static portal, links, search and diagrams
        working-directory: documentation
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm test && npm run build

      - name: Verify isolated static container
        run: bash documentation/scripts/test-container.sh --browser

      - name: Validate OpenAPI contract
        if: ${{ needs.detect-changes.outputs.openapi == 'true' }}
        run: bash scripts/validate-openapi.sh

      - name: Verify generated OpenAPI web documentation
        if: ${{ needs.detect-changes.outputs.openapi == 'true' }}
        run: |
          npm run build:openapi-docs
          git diff --exit-code -- docs/architecture/api/reference/index.html

  frontend:
    name: Frontend static, type, component and build checks
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated OpenAPI types are current
        run: |
          npm run frontend:generate-api
          git diff --exit-code -- frontend/src/shared/api/generated/schema.d.ts

      - name: Run frontend verification
        run: npm run frontend:verify

  browser-smoke:
    name: Packaged application Chromium smoke and accessibility check
    if: ${{ needs.detect-changes.outputs.browser == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Run the pinned browser smoke test without retries
        env:
          PACKAGE_SKIP_BACKEND_TESTS: ${{ needs.detect-changes.outputs.backend }}
        run: bash scripts/validate-browser.sh

      - name: Preserve browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  identity-compatibility:
    name: Real Keycloak 26.7 OIDC BFF compatibility
    if: ${{ needs.detect-changes.outputs.identity == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the private-dev identity alignment and mail transports without retries
        run: bash scripts/validate-private-dev-identity.sh

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Prove real OIDC login and opaque BFF session without retries
        env:
          PACKAGE_SKIP_BACKEND_TESTS: ${{ needs.detect-changes.outputs.backend }}
        run: bash scripts/validate-identity.sh

      - name: Prove the public-production realm and BFF issuer/cookie contract without retries
        env:
          PRODUCTION_IDENTITY_REUSE_PACKAGE: "true"
        run: bash scripts/validate-production-identity.sh

      - name: Prove personal-data export, erasure, deletion ledger and restore replay without retries
        env:
          PERSONAL_DATA_REUSE_PACKAGE: "true"
        run: bash scripts/validate-personal-data.sh

      - name: Preserve sanitized identity-browser diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-browser-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  runtime-telemetry:
    name: Private-dev topology and telemetry
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate topology and bounded synthetic OTLP receipt
        run: |
          bash scripts/validate-private-dev-runtime.sh
          bash scripts/validate-private-dev-runtime.sh --telemetry-smoke

  production-runtime:
    name: Public-production runtime contract
    if: ${{ needs.detect-changes.outputs.production_runtime == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check topology, exposure, secrets and edge routes with synthetic inputs
        run: python3 -I scripts/test-public-production-runtime.py

  runtime-alerts:
    name: Private-dev alert rules and Grafana lifecycle
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Promtool rules and the original-timing Grafana alert lifecycle
        run: python3 deploy/private-dev/grafana/check-alerts.py --smoke

  runtime-product-growth:
    name: Private-dev optimized Keycloak registration metrics
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Prove optimized image, PostgreSQL identity persistence and registration metrics
        run: python3 deploy/private-dev/grafana/check-product-growth.py

  runtime-notifications:
    name: Private-dev native Telegram routing against isolated mock
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate native Telegram routing without real credentials or egress
        run: python3 deploy/private-dev/grafana/check-notifications.py --smoke

  runtime-logs:
    name: Private-dev structured log collection
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate disposable structured log collection and search
        run: python3 scripts/private-dev-logs-check.py --smoke

  localization-image:
    name: AMD64 localization helper image
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify dependency platforms
        run: bash scripts/local-dependencies.sh verify-images

      - name: Check and build the private localization helper
        run: |
          docker build --check tools/catalogue-localization
          docker build --platform linux/amd64 tools/catalogue-localization

  container-image:
    name: AMD64 application image
    if: ${{ needs.detect-changes.outputs.container == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false

      - name: Build, inspect, run and scan the AMD64 application image
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/validate-container-image.sh

      - name: Preserve manifest, runtime, scan and CycloneDX evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-evidence-${{ github.sha }}
          path: |
            target/container-evidence/
            !target/container-evidence/application-image.oci.tar
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the exact scanned OCI archive for trusted publication
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-oci-${{ github.sha }}
          compression-level: 0
          path: |
            target/container-evidence/application-image.oci.tar
            target/container-evidence/SHA256SUMS
            target/container-evidence/image-digest.txt
          if-no-files-found: error
          retention-days: 1

  dependency-images:
    name: AMD64 production dependency image
    if: ${{ needs.detect-changes.outputs.dependency_images == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [keycloak, catalogue-localizer]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          cache-binary: false

      - name: Build, inspect, run and scan the AMD64 image
        env:
          SOURCE_REVISION: ${{ github.sha }}
          DEPENDENCY_IMAGE: ${{ matrix.image }}
        run: bash scripts/validate-dependency-image.sh "$DEPENDENCY_IMAGE"

      - name: Preserve content, scan and CycloneDX evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-image-evidence-${{ matrix.image }}-${{ github.sha }}
          path: |
            target/dependency-image-evidence/${{ matrix.image }}/
            !target/dependency-image-evidence/${{ matrix.image }}/image.oci.tar
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the exact scanned OCI archive for trusted publication
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-image-oci-${{ matrix.image }}-${{ github.sha }}
          compression-level: 0
          path: |
            target/dependency-image-evidence/${{ matrix.image }}/image.oci.tar
            target/dependency-image-evidence/${{ matrix.image }}/SHA256SUMS
            target/dependency-image-evidence/${{ matrix.image }}/image-digest.txt
            target/dependency-image-evidence/${{ matrix.image }}/scan-policy.txt
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Java backend, architecture and PostgreSQL integration
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Test catalogue localization helper and operator boundaries
        run: python3 -m unittest discover -s tools/catalogue-localization -p 'test_*.py'

      - name: Compile, test and package the backend
        run: ./mvnw -Dsource.revision="${GITHUB_SHA}" clean verify

      - name: Preserve JaCoCo XML and HTML reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

  migrations:
    name: Fresh PostgreSQL 18 migration
    if: ${{ needs.detect-changes.outputs.migrations == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Bootstrap roles without exposing passwords in process arguments or logs
        run: python3 -I scripts/test-postgres-bootstrap.py

      - name: Create and migrate a fresh PostgreSQL 18 database
        run: bash scripts/validate-migrations.sh

  provider-fixtures:
    name: IGDB PoC local fixtures
    if: ${{ needs.detect-changes.outputs.provider_fixtures == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: tools/igdb-poc/pom.xml

      - name: Verify provider behaviour with local fixtures only
        run: ./mvnw -f tools/igdb-poc/pom.xml clean verify

  sonarcloud:
    name: SonarQube Cloud quality gate
    if: ${{ needs.detect-changes.outputs.sonar == 'true' }}
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SONAR_ANALYSIS_ENABLED: ${{ github.event_name == 'push' || (vars.SONAR_PR_ANALYSIS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Explain why SonarQube Cloud is not applicable
        if: ${{ env.SONAR_ANALYSIS_ENABLED != 'true' }}
        run: |
          printf '%s\n' \
            'SonarQube Cloud PR analysis is disabled for this plan or unavailable to untrusted code.' \
            'All other applicable pull-request quality and security gates remain required.'

      - name: Require the configured SonarQube Cloud token
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN == '' }}
        run: |
          printf 'SONAR_TOKEN is required for applicable SonarQube Cloud analysis.\n' >&2
          exit 1

      - name: Check out the analyzed revision with complete history
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Set up Node.js 24 for JavaScript and TypeScript analysis
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build, import JaCoCo XML and wait for Sonar way
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        run: |
          ./mvnw \
            -Dsource.revision="${GITHUB_SHA}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar

  required-quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - detect-changes
      - documentation-contracts
      - frontend
      - browser-smoke
      - identity-compatibility
      - container-image
      - runtime-telemetry
      - production-runtime
      - runtime-alerts
      - runtime-product-growth
      - runtime-notifications
      - runtime-logs
      - localization-image
      - dependency-images
      - backend
      - migrations
      - provider-fixtures
      - sonarcloud
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify applicable quality checks
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          DOCUMENTATION_EXPECTED: ${{ needs.detect-changes.outputs.documentation }}
          DOCUMENTATION_CONTRACTS: ${{ needs.documentation-contracts.result }}
          FRONTEND_EXPECTED: ${{ needs.detect-changes.outputs.frontend }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER_EXPECTED: ${{ needs.detect-changes.outputs.browser }}
          BROWSER_SMOKE: ${{ needs.browser-smoke.result }}
          IDENTITY_EXPECTED: ${{ needs.detect-changes.outputs.identity }}
          IDENTITY_COMPATIBILITY: ${{ needs.identity-compatibility.result }}
          CONTAINER_EXPECTED: ${{ needs.detect-changes.outputs.container }}
          CONTAINER_IMAGE: ${{ needs.container-image.result }}
          RUNTIME_TELEMETRY: ${{ needs.runtime-telemetry.result }}
          PRODUCTION_RUNTIME_EXPECTED: ${{ needs.detect-changes.outputs.production_runtime }}
          PRODUCTION_RUNTIME: ${{ needs.production-runtime.result }}
          RUNTIME_ALERTS: ${{ needs.runtime-alerts.result }}
          RUNTIME_PRODUCT_GROWTH: ${{ needs.runtime-product-growth.result }}
          RUNTIME_NOTIFICATIONS: ${{ needs.runtime-notifications.result }}
          RUNTIME_LOGS: ${{ needs.runtime-logs.result }}
          LOCALIZATION_IMAGE: ${{ needs.localization-image.result }}
          DEPENDENCY_IMAGES_EXPECTED: ${{ needs.detect-changes.outputs.dependency_images }}
          DEPENDENCY_IMAGES: ${{ needs.dependency-images.result }}
          BACKEND_EXPECTED: ${{ needs.detect-changes.outputs.backend }}
          BACKEND: ${{ needs.backend.result }}
          MIGRATIONS_EXPECTED: ${{ needs.detect-changes.outputs.migrations }}
          MIGRATIONS: ${{ needs.migrations.result }}
          PROVIDER_EXPECTED: ${{ needs.detect-changes.outputs.provider_fixtures }}
          PROVIDER_FIXTURES: ${{ needs.provider-fixtures.result }}
          SONAR_EXPECTED: ${{ needs.detect-changes.outputs.sonar }}
          SONARCLOUD: ${{ needs.sonarcloud.result }}
        run: |
          bash scripts/verify-ci-results.sh \
            detect-changes true "$DETECT_CHANGES" \
            documentation-contracts "$DOCUMENTATION_EXPECTED" "$DOCUMENTATION_CONTRACTS" \
            frontend "$FRONTEND_EXPECTED" "$FRONTEND" \
            browser-smoke "$BROWSER_EXPECTED" "$BROWSER_SMOKE" \
            identity-compatibility "$IDENTITY_EXPECTED" "$IDENTITY_COMPATIBILITY" \
            container-image "$CONTAINER_EXPECTED" "$CONTAINER_IMAGE" \
            runtime-telemetry "$CONTAINER_EXPECTED" "$RUNTIME_TELEMETRY" \
            production-runtime "$PRODUCTION_RUNTIME_EXPECTED" "$PRODUCTION_RUNTIME" \
            runtime-alerts "$CONTAINER_EXPECTED" "$RUNTIME_ALERTS" \
            runtime-product-growth "$CONTAINER_EXPECTED" "$RUNTIME_PRODUCT_GROWTH" \
            runtime-notifications "$CONTAINER_EXPECTED" "$RUNTIME_NOTIFICATIONS" \
            runtime-logs "$CONTAINER_EXPECTED" "$RUNTIME_LOGS" \
            localization-image "$CONTAINER_EXPECTED" "$LOCALIZATION_IMAGE" \
            dependency-images "$DEPENDENCY_IMAGES_EXPECTED" "$DEPENDENCY_IMAGES" \
            backend "$BACKEND_EXPECTED" "$BACKEND" \
            migrations "$MIGRATIONS_EXPECTED" "$MIGRATIONS" \
            provider-fixtures "$PROVIDER_EXPECTED" "$PROVIDER_FIXTURES" \
            sonarcloud "$SONAR_EXPECTED" "$SONARCLOUD"

  publish-container-image:
    name: Publish immutable application image
    if: ${{ github.event_name == 'push' }}
    needs:
      - container-image
      - required-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
    steps:
      - name: Download the exact scanned OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-image-oci-${{ github.sha }}
          path: target/container-evidence

      - name: Verify the retained archive checksum
        working-directory: target/container-evidence
        run: sha256sum --check SHA256SUMS

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the already-scanned AMD64 image by commit SHA
        run: |
          docker run --rm \
            --volume "$PWD/target/container-evidence:/evidence:ro" \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" \
            copy \
              --all \
              --preserve-digests \
              --authfile /auth.json \
              oci-archive:/evidence/application-image.oci.tar \
              "docker://$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify and record the published digest and platforms
        run: |
          expected_digest="$(cat target/container-evidence/image-digest.txt)"
          inspection="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG")"
          actual_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<<"$inspection" | head -n 1)"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            printf 'Published digest %s does not match scanned digest %s.\n' \
              "$actual_digest" "$expected_digest" >&2
            exit 1
          fi
          platform="$(docker run --rm \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" inspect --authfile /auth.json \
            --format '{{.Os}}/{{.Architecture}}' "docker://$IMAGE_NAME@$actual_digest")"
          [[ "$platform" == "linux/amd64" ]] || { printf 'Unexpected published platform: %s\n' "$platform" >&2; exit 1; }
          {
            printf 'tag=%s:%s\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf 'digest=%s@%s\n' "$IMAGE_NAME" "$actual_digest"
            printf '%s\n' "$inspection"
          } | tee target/container-evidence/published-image.txt
          {
            printf '### Published immutable OCI image\n\n'
            printf -- '- Commit tag: `%s:%s`\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf -- '- Immutable reference: `%s@%s`\n' "$IMAGE_NAME" "$actual_digest"
            printf -- '- Platform: `linux/amd64`\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve the publication record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-image-publication-${{ github.sha }}
          path: target/container-evidence/published-image.txt
          if-no-files-found: error
          retention-days: 30

  publish-dependency-images:
    name: Publish immutable production dependency image
    if: ${{ github.event_name == 'push' }}
    needs:
      - dependency-images
      - required-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [keycloak, catalogue-localizer]
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ matrix.image }}
      DEPENDENCY_IMAGE: ${{ matrix.image }}
      IMAGE_TAG: ${{ github.sha }}
      SKOPEO_IMAGE: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
    steps:
      - name: Download the exact scanned OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-image-oci-${{ matrix.image }}-${{ github.sha }}
          path: target/dependency-image-evidence

      - name: Verify the retained archive checksum
        working-directory: target/dependency-image-evidence
        run: sha256sum --check SHA256SUMS

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the already-scanned AMD64 image by commit SHA
        run: |
          docker run --rm \
            --volume "$PWD/target/dependency-image-evidence:/evidence:ro" \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" \
            copy \
              --all \
              --preserve-digests \
              --authfile /auth.json \
              oci-archive:/evidence/image.oci.tar \
              "docker://$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify and record the published digest and platform
        run: |
          expected_digest="$(cat target/dependency-image-evidence/image-digest.txt)"
          inspection="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG")"
          actual_digest="$(sed -n 's/^Digest:[[:space:]]*//p' <<<"$inspection" | head -n 1)"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            printf 'Published digest %s does not match scanned digest %s.\n' \
              "$actual_digest" "$expected_digest" >&2
            exit 1
          fi
          platform="$(docker run --rm \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" inspect --authfile /auth.json \
            --format '{{.Os}}/{{.Architecture}}' "docker://$IMAGE_NAME@$actual_digest")"
          [[ "$platform" == "linux/amd64" ]] || { printf 'Unexpected published platform: %s\n' "$platform" >&2; exit 1; }
          revision="$(docker run --rm \
            --volume "$HOME/.docker/config.json:/auth.json:ro" \
            "$SKOPEO_IMAGE" inspect --authfile /auth.json \
            --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://$IMAGE_NAME@$actual_digest")"
          [[ "$revision" == "$GITHUB_SHA" ]] || { printf 'Unexpected published revision: %s\n' "$revision" >&2; exit 1; }
          {
            printf 'tag=%s:%s\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf 'digest=%s@%s\n' "$IMAGE_NAME" "$actual_digest"
            printf 'revision=%s\n' "$revision"
            cat target/dependency-image-evidence/scan-policy.txt
          } | tee target/dependency-image-evidence/published-image.txt
          {
            printf '### Published %s image\n\n' "$DEPENDENCY_IMAGE"
            printf -- '- Commit tag: `%s:%s`\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf -- '- Immutable reference: `%s@%s`\n' "$IMAGE_NAME" "$actual_digest"
            printf -- '- Platform: `linux/amd64`\n'
            printf -- '- %s\n' "$(tail -n 1 target/dependency-image-evidence/scan-policy.txt)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve the publication record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-image-publication-${{ matrix.image }}-${{ github.sha }}
          path: target/dependency-image-evidence/published-image.txt
          if-no-files-found: error
          retention-days: 30
