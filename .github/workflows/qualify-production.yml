name: Qualify Production candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of the candidate already tested in private-dev
        type: string
        required: true
      image_digest:
        description: Application image sha256 digest from the accepted private-dev promotion
        type: string
        required: true

permissions: {}

jobs:
  qualify:
    name: Qualify exact production SHA and digests
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'rubhern' && github.triggering_actor == 'rubhern' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all release evidence and record the immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY' >production-candidate.json
          import json
          import os
          import sys
          import public_production_integration as release

          try:
              candidate = release.resolve(release.trust.GitHub(os.environ["GH_TOKEN"]), os.environ["REVISION"])
              release.trust.require(candidate["image_digest"] == os.environ["IMAGE_DIGEST"],
                                    "Qualified application digest differs from the private-dev selection.")
          except release.trust.Refused as error:
              sys.exit(str(error))
          print(json.dumps(candidate, indent=2))
          PY
          {
            echo '### Production candidate qualified'
            echo 'The release deployment independently revalidates these identities and the protected approvals.'
            echo
            echo '~~~json'
            cat production-candidate.json
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Retain the candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-candidate.json
          if-no-files-found: error
          retention-days: 30
