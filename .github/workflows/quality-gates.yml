name: Walking-skeleton quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  documentation-contracts:
    name: Documentation and API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors in the reviewed change
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --check --root --no-commit-id --recursive "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Validate GitHub Actions workflows
        run: bash scripts/validate-actions.sh

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm dependencies
        run: npm ci

      - name: Validate documentation
        run: bash scripts/validate-docs.sh

      - name: Validate OpenAPI contract
        run: bash scripts/validate-openapi.sh

      - name: Verify generated OpenAPI web documentation
        run: |
          npm run build:openapi-docs
          git diff --exit-code -- docs/architecture/api/reference/index.html

  frontend:
    name: Frontend static, type, component and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm dependencies
        run: npm ci

      - name: Verify generated OpenAPI types are current
        run: |
          npm run frontend:generate-api
          git diff --exit-code -- frontend/src/shared/api/generated/schema.d.ts

      - name: Run frontend verification
        run: npm run frontend:verify

  browser-smoke:
    name: Frontend Chromium smoke and accessibility check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run the pinned browser smoke test without retries
        run: bash scripts/validate-browser.sh

      - name: Preserve browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Java backend, architecture and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Compile, test and package the backend
        run: ./mvnw -Dsource.revision="${GITHUB_SHA}" clean verify

      - name: Preserve JaCoCo XML and HTML reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

  migrations:
    name: Fresh PostgreSQL 18 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Create and migrate a fresh PostgreSQL 18 database
        run: bash scripts/validate-migrations.sh

  provider-fixtures:
    name: IGDB PoC local fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: tools/igdb-poc/pom.xml

      - name: Verify provider behaviour with local fixtures only
        run: ./mvnw -f tools/igdb-poc/pom.xml clean verify

  sonarcloud:
    name: SonarQube Cloud quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SONAR_ANALYSIS_ENABLED: ${{ github.event_name == 'push' || (vars.SONAR_PR_ANALYSIS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Explain why SonarQube Cloud is not applicable
        if: ${{ env.SONAR_ANALYSIS_ENABLED != 'true' }}
        run: |
          printf '%s\n' \
            'SonarQube Cloud PR analysis is disabled for this plan or unavailable to untrusted code.' \
            'The local quality and security gates remain required.'

      - name: Require the configured SonarQube Cloud token
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN == '' }}
        run: |
          printf 'SONAR_TOKEN is required for applicable SonarQube Cloud analysis.\n' >&2
          exit 1

      - name: Check out the analyzed revision with complete history
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 25
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      - name: Set up Node.js 24 for JavaScript and TypeScript analysis
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build, import JaCoCo XML and wait for Sonar way
        if: ${{ env.SONAR_ANALYSIS_ENABLED == 'true' && env.SONAR_TOKEN != '' }}
        run: |
          ./mvnw \
            -Dsource.revision="${GITHUB_SHA}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar

  required-quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - documentation-contracts
      - frontend
      - browser-smoke
      - backend
      - migrations
      - provider-fixtures
      - sonarcloud
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject any incomplete quality check
        env:
          DOCUMENTATION_CONTRACTS: ${{ needs.documentation-contracts.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER_SMOKE: ${{ needs.browser-smoke.result }}
          BACKEND: ${{ needs.backend.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          PROVIDER_FIXTURES: ${{ needs.provider-fixtures.result }}
          SONARCLOUD: ${{ needs.sonarcloud.result }}
        run: |
          for result in \
            "$DOCUMENTATION_CONTRACTS" \
            "$FRONTEND" \
            "$BROWSER_SMOKE" \
            "$BACKEND" \
            "$MIGRATIONS" \
            "$PROVIDER_FIXTURES" \
            "$SONARCLOUD"
          do
            if [[ "$result" != "success" ]]; then
              printf 'Required job finished with result: %s\n' "$result" >&2
              exit 1
            fi
          done
