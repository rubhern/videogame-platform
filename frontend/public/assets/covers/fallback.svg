  <text x="58" y="738" fill="#b8c2cc" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">CARÁTULA NO DISPONIBLE</text>
  <rect width="600" height="800" filter="url(#grain)" opacity=".55"/>
