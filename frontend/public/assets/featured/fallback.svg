<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Imagen destacada no disponible</title>
  <desc id="description">Marcador apaisado de Gameómetro para un juego sin imagen destacada.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1a2342"/><stop offset=".55" stop-color="#0d1222"/><stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0" cy="0" r="1" gradientTransform="translate(700 330) rotate(160) scale(900 560)">
      <stop stop-color="#b99cff" stop-opacity=".5"/><stop offset="1" stop-color="#b99cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientTransform="translate(820 470) scale(460 340)">
      <stop stop-color="#ff8c3a" stop-opacity=".2"/><stop offset="1" stop-color="#ff8c3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
    <linearGradient id="fbm-ice" gradientUnits="userSpaceOnUse" x1="0" y1="8.8" x2="0" y2="55.2"><stop offset="0" stop-color="#ffffff"/><stop offset="0.46" stop-color="#e3eaff"/><stop offset="1" stop-color="#9db3ff"/></linearGradient><linearGradient id="fbm-fire" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="49.61" y2="5.89"><stop offset="0" stop-color="#ff4b3e"/><stop offset="0.55" stop-color="#ff8c3a"/><stop offset="1" stop-color="#ffd36e"/></linearGradient><linearGradient id="fbw-word" gradientUnits="userSpaceOnUse" x1="0" y1="676" x2="0" y2="706"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe3f7"/></linearGradient><linearGradient id="fbw-acc" gradientUnits="userSpaceOnUse" x1="198.16" y1="678.9" x2="203.63" y2="670.8"><stop offset="0" stop-color="#ff4b3e"/><stop offset="0.55" stop-color="#ff8c3a"/><stop offset="1" stop-color="#ffd36e"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <rect width="1600" height="900" fill="url(#aurora)"/>
  <rect width="1600" height="900" fill="url(#ember)"/>
  <g transform="translate(800 450) scale(5.6) translate(-32 -32)" opacity=".9">
    <g opacity=".22"><path class="gm-ring" d="M35.39 12.8 A19.5 19.5 0 1 0 51.5 32 L32 32" fill="none" stroke="url(#fbm-ice)" stroke-width="7.4" stroke-linejoin="miter"/></g>
    <g opacity=".85"><g class="gm-needle"><path d="M34.32 33.57 L49.61 5.89 L29.68 30.43 Z" fill="url(#fbm-fire)"/><circle cx="32" cy="32" r="4.6" fill="url(#fbm-fire)"/><circle cx="32" cy="32" r="1.56" fill="#fff4dc"/></g></g>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".55"/>
</svg>
