# Shared acquisition helper mechanics. The environment owns activation and networking.
services:
  catalogue-localizer:
    build:
      context: .
    image: videogame-platform/catalogue-localizer:1.0.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    volumes:
      - type: bind
        source: ${CATALOGUE_TRANSLATION_MODEL_DIR:?Set an immutable converted-model directory}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
