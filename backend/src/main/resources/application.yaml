spring:
  application:
    name: videogame-platform-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${APPLICATION_DB_URL:jdbc:postgresql://localhost:5432/videogame_platform}
    username: ${APPLICATION_DB_USERNAME:videogame_app}
    password: ${APPLICATION_DB_PASSWORD:}
    hikari:
      connection-timeout: ${APPLICATION_DB_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${APPLICATION_DB_VALIDATION_TIMEOUT:1000}
      maximum-pool-size: ${APPLICATION_DB_MAXIMUM_POOL_SIZE:10}
  flyway:
    enabled: ${APPLICATION_FLYWAY_ENABLED:false}
    url: ${APPLICATION_MIGRATION_DB_URL:${APPLICATION_DB_URL:jdbc:postgresql://localhost:5432/videogame_platform}}
    user: ${APPLICATION_MIGRATION_DB_USERNAME:videogame_app_migrator}
    password: ${APPLICATION_MIGRATION_DB_PASSWORD:}
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  modulith:
    runtime:
      verification-enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${APPLICATION_SESSION_TIMEOUT:30m}
      cookie:
        name: ${APPLICATION_SESSION_COOKIE_NAME:vgp_session}
        http-only: true
        secure: ${APPLICATION_SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

identity:
  session:
    # Absolute BFF session lifetime from the OIDC authentication (ID token auth_time); requests
    # never extend it, unlike the idle server.servlet.session.timeout above. ADR-0027.
    absolute-timeout: ${APPLICATION_SESSION_ABSOLUTE_TIMEOUT:8h}
    # How long administrative revocation waits for running personal writes before it reports an
    # unsettled outcome; personal writes pause meanwhile. It bounds availability, not safety.
    revocation-settle-timeout: 30s
  oidc:
    # Expected ID token issuer; every UserId derives from it. With the production realm the BFF
    # refuses to start unless every value below and the provider endpoints match it canonically.
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/videogame-platform}
    # Explicit like the other provider endpoints: the browser-facing issuer's RP-initiated logout.
    end-session-uri: ${OIDC_END_SESSION_URI:${identity.oidc.issuer-uri}/protocol/openid-connect/logout}
    # Must equal the realm client's registered post-logout URI exactly.
    post-logout-redirect-uri: "${APPLICATION_OIDC_POST_LOGOUT_REDIRECT_URI:{baseUrl}/}"

catalogue:
  localization:
    endpoint: ${CATALOGUE_TRANSLATION_ENDPOINT:http://127.0.0.1:8092/translate}
    timeout: ${CATALOGUE_TRANSLATION_TIMEOUT:30s}
  jdbc:
    read-timeout: ${CATALOGUE_JDBC_READ_TIMEOUT:5s}
  releases:
    # Bounds the releases grouped under one game so request memory stays O(pageSize x limit);
    # the synchronization cap keeps a game at most this many releases in total.
    release-group-limit: ${CATALOGUE_RELEASES_RELEASE_GROUP_LIMIT:25}
    freshness-threshold: ${CATALOGUE_RELEASES_FRESHNESS_THRESHOLD:P7D}
  search:
    release-context-limit: ${CATALOGUE_SEARCH_RELEASE_CONTEXT_LIMIT:3}
  synchronization:
    # Internal IGDB page bound; it never limits total Games in the requested window.
    provider-page-size: ${CATALOGUE_SYNC_PROVIDER_PAGE_SIZE:500}
    max-releases-per-game: ${CATALOGUE_SYNC_MAX_RELEASES_PER_GAME:25}
    retained-runs: ${CATALOGUE_SYNC_RETAINED_RUNS:50}
    abandon-run-after: ${CATALOGUE_SYNC_ABANDON_RUN_AFTER:PT30M}
    scheduling:
      # Opt-in even when credentials exist; '-' disables an individual policy. The widest
      # future-days of the policies not disabled also bounds featured months (UC-010).
      enabled: ${CATALOGUE_SYNC_SCHEDULING_ENABLED:false}
      near-term:
        cron: "${CATALOGUE_SYNC_NEAR_TERM_CRON:0 0 4 * * *}"
        past-days: ${CATALOGUE_SYNC_NEAR_TERM_PAST_DAYS:28}
        future-days: ${CATALOGUE_SYNC_NEAR_TERM_FUTURE_DAYS:28}
      upcoming:
        cron: "${CATALOGUE_SYNC_UPCOMING_CRON:0 0 5 * * SUN}"
        past-days: ${CATALOGUE_SYNC_UPCOMING_PAST_DAYS:0}
        future-days: ${CATALOGUE_SYNC_UPCOMING_FUTURE_DAYS:180}
    cover:
      fallback-asset-path: ${CATALOGUE_SYNC_FALLBACK_COVER_PATH:/assets/covers/fallback.svg}
      fallback-source-name: ${CATALOGUE_SYNC_FALLBACK_COVER_SOURCE:VideoGame Platform}
    provider:
      client-id: ${IGDB_CLIENT_ID:}
      client-secret: ${IGDB_CLIENT_SECRET:}
      token-uri: ${IGDB_TOKEN_URI:https://id.twitch.tv/oauth2/token}
      api-base-uri: ${IGDB_API_BASE_URI:https://api.igdb.com/v4/}
      request-timeout: ${IGDB_REQUEST_TIMEOUT:10s}
      requests-per-second: ${IGDB_REQUESTS_PER_SECOND:3}
      max-retries: ${IGDB_MAX_RETRIES:2}
      retry-backoff: ${IGDB_RETRY_BACKOFF:250ms}
      # Provider platform and release-region taxonomy is acquired from accepted releases through
      # typed provider references keyed by provider entity ID; there is no product-owned allowlist
      # to configure. See #178 and the catalogue synchronization documentation.

ratings:
  jdbc:
    operation-timeout: ${RATINGS_JDBC_OPERATION_TIMEOUT:5s}

api:
  admission:
    # Opt-in experiment; production values require #275/#276 capacity qualification.
    enabled: ${APPLICATION_API_ADMISSION_ENABLED:false}
    max-requests: ${APPLICATION_API_MAX_REQUESTS:8}
    max-writes: ${APPLICATION_API_MAX_WRITES:2}
  releases:
    cache-control: ${CATALOGUE_RELEASES_CACHE_CONTROL:public, no-cache}
  games:
    cache-control: ${CATALOGUE_SEARCH_CACHE_CONTROL:public, no-cache}

platform:
  readiness:
    catalogue-store-query-timeout: ${APPLICATION_CATALOGUE_READINESS_TIMEOUT:2s}

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,catalogueStore
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,cataloguesync,releasestagerepair,cataloguelocalize,cataloguecoverage,sessionrevocation
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        catalogue.synchronization.provider.request.duration: true
  info:
    env:
      enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${TELEMETRY_DEPLOYMENT_ENVIRONMENT:local}
      service.version: ${TELEMETRY_SERVICE_VERSION:development}
    tracing:
      export:
        otlp:
          connect-timeout: 1s
          endpoint: ${TELEMETRY_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 5s
  otlp:
    metrics:
      export:
        enabled: ${TELEMETRY_OTLP_METRICS_ENABLED:false}
        step: ${TELEMETRY_OTLP_METRICS_STEP:60s}
        url: ${TELEMETRY_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    export:
      otlp:
        enabled: ${TELEMETRY_OTLP_TRACES_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${TELEMETRY_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  include-application-name: false
  pattern:
    # Plain console lines keep Boot's [traceId-spanId] and add [correlationId] when a request has
    # one, so a reported Problem instance can be matched without the structured profile.
    correlation: '%correlationId%replace([%X{correlationId:-}] ){"\[\] ",""}'
  level:
    root: INFO
    com.videogameplatform: INFO

---
spring:
  config:
    activate:
      on-profile: structured

logging:
  structured:
    format:
      console: ecs
    json:
      stacktrace:
        max-length: 2048
        max-throwable-depth: 20
