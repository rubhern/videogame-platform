spring:
  application:
    name: videogame-platform-backend
  datasource:
    url: ${APPLICATION_DB_URL:jdbc:postgresql://localhost:5432/videogame_platform}
    username: ${APPLICATION_DB_USERNAME:videogame_app}
    password: ${APPLICATION_DB_PASSWORD:}
    hikari:
      connection-timeout: ${APPLICATION_DB_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${APPLICATION_DB_VALIDATION_TIMEOUT:1000}
      maximum-pool-size: ${APPLICATION_DB_MAXIMUM_POOL_SIZE:10}
  flyway:
    enabled: ${APPLICATION_FLYWAY_ENABLED:false}
    url: ${APPLICATION_MIGRATION_DB_URL:${APPLICATION_DB_URL:jdbc:postgresql://localhost:5432/videogame_platform}}
    user: ${APPLICATION_MIGRATION_DB_USERNAME:videogame_app_migrator}
    password: ${APPLICATION_MIGRATION_DB_PASSWORD:}
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  modulith:
    runtime:
      verification-enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${APPLICATION_SESSION_TIMEOUT:30m}
      cookie:
        name: ${APPLICATION_SESSION_COOKIE_NAME:vgp_session}
        http-only: true
        secure: ${APPLICATION_SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

catalogue:
  jdbc:
    read-timeout: ${CATALOGUE_JDBC_READ_TIMEOUT:5s}
  releases:
    recent-window-months: ${CATALOGUE_RELEASES_RECENT_WINDOW_MONTHS:6}
    upcoming-window-months: ${CATALOGUE_RELEASES_UPCOMING_WINDOW_MONTHS:6}
    freshness-threshold: ${CATALOGUE_RELEASES_FRESHNESS_THRESHOLD:P7D}

api:
  releases:
    cache-control: ${CATALOGUE_RELEASES_CACHE_CONTROL:public, max-age=60, stale-while-revalidate=300}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,catalogueStore
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          connect-timeout: 1s
          endpoint: ${TELEMETRY_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 5s
  otlp:
    metrics:
      export:
        enabled: ${TELEMETRY_OTLP_METRICS_ENABLED:false}
        step: ${TELEMETRY_OTLP_METRICS_STEP:60s}
        url: ${TELEMETRY_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  tracing:
    export:
      otlp:
        enabled: ${TELEMETRY_OTLP_TRACES_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${TELEMETRY_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  include-application-name: false
  level:
    root: INFO
    com.videogameplatform: INFO

---
spring:
  config:
    activate:
      on-profile: structured

logging:
  structured:
    format:
      console: ecs
    json:
      stacktrace:
        max-length: 2048
        max-throwable-depth: 20
