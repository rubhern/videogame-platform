spring:
  config:
    activate:
      on-profile: oidc
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: videogame-platform-bff
            client-secret: ${KEYCLOAK_BFF_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/videogame-platform}
