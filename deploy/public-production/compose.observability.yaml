# Production observability candidate. Use together with compose.yaml; no environment is contacted.
# Shared dashboard/datasource/notification sources remain under private-dev.
# The host sampler has a separate 64 MiB one-shot ceiling; steady services plus it total 640 MiB.
services:
  telemetry:
    image: otel/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - telemetry
    restart: unless-stopped
    stop_grace_period: 20s
    # Bound Go-managed memory below the cgroup ceiling, leaving native/runtime headroom.
    environment:
      GOMEMLIMIT: 48MiB
    mem_limit: 96m
    cpus: 0.15
    pids_limit: 128
    init: true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  prometheus:
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=512MiB
    - --query.timeout=15s
    - --query.max-concurrency=2
    - --query.max-samples=1000000
    volumes:
    - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./observability/keycloak.yaml:/etc/prometheus/keycloak.yaml:ro
    - prometheus-data:/prometheus
    networks:
    - telemetry
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      GOMEMLIMIT: 64MiB
    mem_limit: 96m
    cpus: 0.35
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    entrypoint:
    - /bin/sh
    - /etc/grafana/production-start
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      # Go soft limit leaves room for SQLite, native allocations and tmpfs.
      GOMEMLIMIT: 192MiB
      GF_SECURITY_ADMIN_USER: owner
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'true'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_LOG_MODE: console
      GRAFANA_TELEGRAM_ENABLED: ${PRODUCTION_TELEGRAM_ENABLED:-false}
      GRAFANA_PRODUCT_NOTIFICATIONS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_UNIFIED_ALERTING_MAX_ATTEMPTS: '1'
    secrets:
    - grafana_admin_password
    - grafana_database_password
    - grafana_telegram_bot_token
    - grafana_telegram_chat_id
    volumes:
    - ../private-dev/grafana/bin/start:/etc/grafana/start:ro
    - ../private-dev/grafana/provisioning/datasources/postgres.yaml:/etc/grafana/provisioning/datasources/postgres.yaml:ro
    - ../private-dev/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    - grafana-data:/var/lib/grafana
    - ./observability/grafana/start:/etc/grafana/production-start:ro
    - ../private-dev/grafana/bin/provision-notifications:/etc/grafana/provision-notifications:ro
    - ../private-dev/grafana/notifications.json.template:/etc/grafana/notifications.json.template:ro
    - ../private-dev/grafana/dashboards:/etc/grafana/canonical-dashboards:ro
    - ../private-dev/grafana/provisioning/alerting/private-dev.json:/etc/grafana/canonical-alerts.json:ro
    - ./observability/grafana:/etc/grafana/production:ro
    networks:
    - telemetry
    - observability-data
    - notification-egress
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 320m
    cpus: 0.35
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    group_add:
    - ${PRODUCTION_SECRETS_GID:?Set PRODUCTION_SECRETS_GID in runtime.env}
  node-exporter:
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - telemetry
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 32
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/host/root
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
    - --collector.pressure
    - --collector.diskstats
    - --collector.filesystem
    - --collector.vmstat
    - --collector.textfile
    - --collector.textfile.directory=/textfile
    - --collector.filesystem.mount-points-include=^/$
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/host/root:ro,rslave
    - ${PRODUCTION_METRICS_DIR:-/var/lib/gameometro/production/metrics}:/textfile:ro
  blackbox:
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - telemetry
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 32
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    command:
    - --config.file=/etc/blackbox/config.yaml
    volumes:
    - ./observability/blackbox.yaml:/etc/blackbox/config.yaml:ro
  application:
    environment:
      TELEMETRY_OTLP_METRICS_ENABLED: 'true'
      TELEMETRY_OTLP_METRICS_ENDPOINT: http://telemetry:4318/v1/metrics
      TELEMETRY_OTLP_TRACES_ENABLED: 'false'
    networks:
      telemetry: {}
  keycloak:
    networks:
      telemetry: {}
  postgres:
    networks:
      observability-data: {}
  caddy:
    networks:
      telemetry:
        aliases:
        - gameometro.com
        - auth.gameometro.com
secrets:
  grafana_admin_password:
    file: ${PRODUCTION_SECRETS_DIR:?Set PRODUCTION_SECRETS_DIR in runtime.env}/grafana-admin-password
  grafana_database_password:
    file: ${PRODUCTION_SECRETS_DIR:?Set PRODUCTION_SECRETS_DIR in runtime.env}/grafana-database-password
  grafana_telegram_bot_token:
    file: ${PRODUCTION_SECRETS_DIR:?Set PRODUCTION_SECRETS_DIR in runtime.env}/grafana-telegram-bot-token
  grafana_telegram_chat_id:
    file: ${PRODUCTION_SECRETS_DIR:?Set PRODUCTION_SECRETS_DIR in runtime.env}/grafana-telegram-chat-id
networks:
  observability-data:
    internal: true
  notification-egress: {}
volumes:
  grafana-data: {}
  prometheus-data: {}
