receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 72
    spike_limit_mib: 16
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    translation_strategy: UnderscoreEscapingWithSuffixes
    metric_expiration: 5m
    send_timestamps: false
    enable_open_metrics: false
    without_scope_info: true
service:
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - prometheus
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
              without_type_suffix: false
