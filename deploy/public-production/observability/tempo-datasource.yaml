apiVersion: 1
# ADR-0046. Points only at this runtime's Tempo. Do not prune here: the metrics datasource file owns
# pruning. From a span, "Logs for this span" opens the application log lines of the same trace.
datasources:
  - name: Platform traces
    uid: production-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      timeout: 15
      tracesToLogsV2:
        datasourceUid: private-dev-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceId: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="videogame-platform-backend"} | trace_id="$${__span.traceId}"'
      nodeGraph:
        enabled: false
      search:
        hide: false
