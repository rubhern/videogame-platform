# Production application logs (ADR-0040). Single tenant: the internal telemetry network, shared
# only with the collector and Grafana, is the trust boundary. History is disposable diagnostics,
# never backed up and never an audit trail.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: warn
  http_server_read_timeout: 15s
  http_server_write_timeout: 15s
common:
  path_prefix: /loki
  # All modules share this process; RPC must use the loopback-only gRPC listener.
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
    cache_ttl: 1h
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  retention_delete_worker_count: 1
  delete_request_store: filesystem
limits_config:
  # Six days: asynchronous deletion still completes within the seven-day routine-log limit of
  # docs/development/data-protection.md.
  retention_period: 144h
  # About 1.7 GiB of uncompressed input per day at the sustained rate; the collector drops,
  # never blocks, what Loki refuses.
  ingestion_rate_mb: 0.02
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 32KB
  per_stream_rate_limit_burst: 256KB
  allow_structured_metadata: true
  max_global_streams_per_user: 16
  max_label_names_per_series: 6
  max_label_value_length: 64
  max_line_size: 16KB
  max_line_size_truncate: false
  max_structured_metadata_size: 16KB
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  creation_grace_period: 5m
  max_query_lookback: 144h
  max_query_length: 144h
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  max_entries_limit_per_query: 1000
  query_timeout: 15s
  split_queries_by_interval: 1h
  volume_enabled: true
querier:
  max_concurrent: 2
query_range:
  parallelise_shardable_queries: false
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  chunk_target_size: 262144
  wal:
    dir: /loki/wal
    replay_memory_ceiling: 64MB
analytics:
  reporting_enabled: false
