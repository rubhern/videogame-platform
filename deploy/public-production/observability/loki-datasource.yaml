apiVersion: 1
# ADR-0040, ADR-0046. The UID keeps the private-dev name, like the other production datasources; it
# points only at this runtime's Loki. Do not prune here: the metrics datasource file owns pruning.
datasources:
  - name: Platform logs
    uid: private-dev-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 15
      maxLines: 1000
      # ADR-0046: a log line written inside a sampled request links to its trace. The appender stores
      # the trace ID as structured metadata; unsampled requests have no stored trace to open.
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: production-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
