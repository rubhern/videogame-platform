apiVersion: 1
# ADR-0040. The UID keeps the private-dev name, like the other production datasources; it
# points only at this runtime's Loki. Do not prune here: the metrics datasource file owns pruning.
datasources:
  - name: Platform logs
    uid: private-dev-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 15
      maxLines: 1000
