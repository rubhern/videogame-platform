apiVersion: 1
datasources:
  - name: Platform read models
    uid: private-dev-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: videogame_grafana
    editable: false
    jsonData:
      database: videogame_platform
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
    secureJsonData:
      password: $GRAFANA_ANALYTICS_PASSWORD
