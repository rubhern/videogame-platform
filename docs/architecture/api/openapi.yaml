  /platforms:
    get:
      tags: [Catalogue]
      operationId: listPlatforms
      summary: List the catalogue platforms a visitor may choose
      description: |
        Reads the platforms of the local, provider-independent taxonomy that at least one current
        release of the last valid catalogue publication uses, ordered by name, case-insensitively,
        then by `platformId`. These are the choices offered as preferred platforms; a platform no
        current release uses could never narrow release discovery, so it is not offered. The
        taxonomy is bounded and every platform is returned in one response; the read fails rather
        than truncating it. All content is served from PostgreSQL; no provider is called.
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: The selectable platforms, possibly empty.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformList' }
              examples:
                platforms:
                  value:
                    items:
                      - { platformId: platform_switch2, name: Nintendo Switch 2 }
                      - { platformId: platform_ps5, name: PlayStation 5 }
                      - { platformId: platform_win, name: Windows PC }
                empty:
                  value: { items: [] }
        '304': { $ref: '#/components/responses/PublicNotModified' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/PlatformListValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CatalogueUnavailable' }

  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Read minimal BFF session state
      description: |
        Returns `200` without exposing tokens, claims, raw identity-provider roles, email, or an
        internal user ID. An authenticated session may list the server-derived product
        `capabilities` its own principal holds, so the client can offer matching navigation;
        the server still authorizes every protected operation itself.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Anonymous or authenticated session state.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
              examples:
                anonymous: { value: { authenticated: false } }
                authenticated:
                  value: { authenticated: true, csrfToken: opaque-csrf-token }
                catalogueOperator:
                  value:
                    authenticated: true
                    csrfToken: opaque-csrf-token
                    capabilities: [catalogue_administration]
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
    post:
      tags: [Session]
      operationId: logoutSession
      summary: Terminate the current BFF session
      description: |
        Invalidates the opaque application session immediately. To also end this
        browser's identity-provider session, the client then navigates the top-level
        browsing context to the `/auth/logout` authentication route: it redirects once
        through the provider's standard OIDC end-session endpoint, which returns the
        browser to the application root. Other sessions, including the same account's
        on other devices, are unaffected. The response never contains a token; the
        ended session's ID token travels only in that redirect, as the standard
        `id_token_hint`. Without the navigation, only the application session ends.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: |
            The application session is no longer authenticated. A fresh,
            unauthenticated session cookie carries only the pending identity-provider
            logout until `/auth/logout` consumes it.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
  /me/rating-insights:
    get:
      tags: [Ratings]
      operationId: getMyRatingInsights
      summary: Read personal rating statistics
      description: |
        UC-015. One repeatable-read snapshot of only the authenticated principal's current
        active ratings and Ratings-owned projected local genre/game context. No query inputs,
        external/community scores or provider access. Fixed-size aggregates, never a full history.
        All means round half up to one decimal. A genre receives one full contribution for
        every rated game assigned to it, so genre counts overlap; games without genres are
        counted separately. Genre lists hold at most six entries: most rated by count descending
        then genreId ascending; best rated (at least three games) by unrounded mean descending,
        count descending then genreId ascending. Extreme ties select gameId ascending and count
        every tied game. Activity is twelve calendar months ending in evaluatedOn's month in
        Europe/Madrid, counting surviving ratings by original creation time; edits do not move
        a contribution and deletion removes it. It is not a historical score or playing log.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Private personal statistics, including an honest empty result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalRatingInsights' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422':
          description: This read does not accept query parameters.
          headers:
