      tags: [Platform preferences]
      operationId: getMyPlatformPreferences
      summary: Read the current user's preferred platforms
      description: |
        Scoped to the authenticated current user, whose identity the server derives from the
        session. `configured` is false until the user first saves a choice, including an empty
        one, so a client can offer its first-run choice once and never again. The platforms are
        ordered like `/platforms`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current user's preferred platforms, possibly none.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformPreferences' }
              examples:
                neverChosen: { value: { configured: false, platforms: [] } }
                chosen:
                  value:
                    configured: true
                    platforms:
                      - { platformId: platform_switch2, name: Nintendo Switch 2 }
                      - { platformId: platform_ps5, name: PlayStation 5 }
                skipped: { value: { configured: true, platforms: [] } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/PlatformPreferencesValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceOverloaded' }
    put:
      tags: [Platform preferences]
      operationId: putMyPlatformPreferences
      summary: Replace the current user's preferred platforms
      description: |
        Replaces the complete set atomically and marks the choice as made; an empty set clears
        every preference, which is also how a first-run choice is skipped. Values are
        de-duplicated. Every value must name a platform of the local taxonomy, otherwise nothing
        changes and the request yields 422. The last successful replacement wins; no
        precondition is required for this personal, idempotent replacement.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformPreferencesWrite' }
            examples:
              twoPlatforms: { value: { platformIds: [platform_ps5, platform_switch2] } }
              clear: { value: { platformIds: [] } }
      responses:
        '200':
          description: The replaced preferences as now stored.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
          content:
