      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            ratingWriteFailed: { $ref: '#/components/examples/RatingWriteFailed' }
            internalError: { $ref: '#/components/examples/InternalError' }
    InternalError:
      description: Unexpected failure without a more specific safe code.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            internalError: { $ref: '#/components/examples/InternalError' }

  examples:
    RequestMalformed:
      value:
        type: urn:videogame-platform:problem:request-malformed
        title: Request is malformed
        status: 400
        detail: The request syntax could not be parsed.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REQUEST_MALFORMED
        category: validation
        correlationId: correlation-opaque
    AuthenticationRequired:
      value:
        type: urn:videogame-platform:problem:authentication-required
        title: Authentication is required
        status: 401
        detail: Establish a session before accessing this resource.
        instance: urn:videogame-platform:problem-instance:opaque
        code: AUTHENTICATION_REQUIRED
        category: authentication
        correlationId: correlation-opaque
    CsrfValidationFailed:
      value:
        type: urn:videogame-platform:problem:csrf-validation-failed
        title: CSRF validation failed
        status: 403
        detail: Obtain current CSRF material and explicitly retry.
        instance: urn:videogame-platform:problem-instance:opaque
        code: CSRF_VALIDATION_FAILED
        category: authorization
        correlationId: correlation-opaque
    GameNotFound:
      value:
        type: urn:videogame-platform:problem:game-not-found
        title: Game was not found
        status: 404
        detail: No supported game exists for the supplied identifier.
        instance: urn:videogame-platform:problem-instance:opaque
        code: GAME_NOT_FOUND
        category: not_found
        correlationId: correlation-opaque
    RatingNotFound:
      value:
        type: urn:videogame-platform:problem:rating-not-found
        title: Rating was not found
        status: 404
        detail: No active rating exists in the authenticated scope.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_NOT_FOUND
        category: not_found
        correlationId: correlation-opaque
    RepresentationNotAcceptable:
      value:
        type: urn:videogame-platform:problem:representation-not-acceptable
        title: Representation is not acceptable
        status: 406
        detail: Request application/json or application/problem+json.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REPRESENTATION_NOT_ACCEPTABLE
        category: validation
        correlationId: correlation-opaque
    RatingAlreadyExists:
      value:
        type: urn:videogame-platform:problem:rating-already-exists
        title: Rating already exists
        status: 412
        detail: Read the existing rating before choosing update intent.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_ALREADY_EXISTS
        category: conflict
        correlationId: correlation-opaque
    RatingWriteConflict:
      value:
        type: urn:videogame-platform:problem:rating-write-conflict
        title: Rating write conflict
        status: 412
        detail: The rating changed; refresh before explicitly retrying.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_WRITE_CONFLICT
        category: conflict
        correlationId: correlation-opaque
    RequestTooLarge:
      value:
        type: urn:videogame-platform:problem:request-too-large
        title: Request is too large
        status: 413
        detail: Reduce the request size before retrying.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REQUEST_TOO_LARGE
        category: validation
        correlationId: correlation-opaque
    MediaTypeUnsupported:
      value:
        type: urn:videogame-platform:problem:media-type-unsupported
        title: Media type is unsupported
        status: 415
        detail: Send the request body as application/json.
        instance: urn:videogame-platform:problem-instance:opaque
        code: MEDIA_TYPE_UNSUPPORTED
        category: validation
        correlationId: correlation-opaque
    FilterInvalid:
      value:
        type: urn:videogame-platform:problem:filter-invalid
        title: Release filter is invalid
        status: 422
        detail: Correct the release view or filter combination.
        instance: urn:videogame-platform:problem-instance:opaque
        code: FILTER_INVALID
        category: validation
        correlationId: correlation-opaque
    PlatformNotSupported:
      value:
        type: urn:videogame-platform:problem:platform-not-supported
        title: Platform is not supported
        status: 422
        detail: Select a platform from the normalized available filters.
        instance: urn:videogame-platform:problem-instance:opaque
        code: PLATFORM_NOT_SUPPORTED
        category: validation
        correlationId: correlation-opaque
    RegionNotSupported:
      value:
        type: urn:videogame-platform:problem:region-not-supported
        title: Region is not supported
        status: 422
        detail: Select a region from the normalized available filters.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REGION_NOT_SUPPORTED
        category: validation
        correlationId: correlation-opaque
    SearchQueryInvalid:
      value:
        type: urn:videogame-platform:problem:search-query-invalid
        title: Search query is invalid
        status: 422
        detail: Supply a non-blank query of at most 100 Unicode code points.
        instance: urn:videogame-platform:problem-instance:opaque
        code: SEARCH_QUERY_INVALID
        category: validation
        correlationId: correlation-opaque
        violations:
          - pointer: /query/q
            code: SEARCH_QUERY_INVALID
            message: Must be non-blank after trimming.
    SortInvalid:
      value:
        type: urn:videogame-platform:problem:sort-invalid
        title: Sort is invalid
        status: 422
        detail: Use a supported sort key and direction.
        instance: urn:videogame-platform:problem-instance:opaque
        code: SORT_INVALID
        category: validation
        correlationId: correlation-opaque
    PaginationInvalid:
      value:
        type: urn:videogame-platform:problem:pagination-invalid
        title: Pagination is invalid
        status: 422
        detail: Use page at least 1 and pageSize from 1 through 100.
        instance: urn:videogame-platform:problem-instance:opaque
        code: PAGINATION_INVALID
        category: validation
        correlationId: correlation-opaque
        violations:
          - pointer: /query/pageSize
            code: PAGINATION_INVALID
            message: Must be between 1 and 100.
    RequestParameterUnknown:
      value:
        type: urn:videogame-platform:problem:request-parameter-unknown
        title: Request parameter is unknown
        status: 422
        detail: Remove unsupported query parameters.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REQUEST_PARAMETER_UNKNOWN
        category: validation
        correlationId: correlation-opaque
    RatingValueInvalid:
      value:
        type: urn:videogame-platform:problem:rating-value-invalid
        title: Rating value is invalid
        status: 422
        detail: Correct the rating value before retrying.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_VALUE_INVALID
        category: validation
        correlationId: correlation-opaque
        violations:
          - pointer: /value
            code: RATING_VALUE_INVALID
            message: Must be an integer from 1 through 10.
    RatingNotEligible:
      value:
        type: urn:videogame-platform:problem:rating-not-eligible
        title: Rating is not eligible
        status: 422
        detail: The game does not currently have qualifying release evidence.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_NOT_ELIGIBLE
        category: business_rule
        correlationId: correlation-opaque
        eligibilityReason: RELEASE_NOT_OCCURRED
    ReleaseDataReviewRequired:
      value:
        type: urn:videogame-platform:problem:release-data-review-required
        title: Release data requires review
        status: 422
        detail: Current release evidence cannot authorize this rating command safely.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RELEASE_DATA_REVIEW_REQUIRED
        category: business_rule
        correlationId: correlation-opaque
        eligibilityReason: RELEASE_REVIEW_REQUIRED
    RequestPropertyUnknown:
      value:
        type: urn:videogame-platform:problem:request-property-unknown
        title: Request property is unknown
        status: 422
        detail: Remove unsupported command properties.
        instance: urn:videogame-platform:problem-instance:opaque
        code: REQUEST_PROPERTY_UNKNOWN
        category: validation
        correlationId: correlation-opaque
    PreconditionRequired:
      value:
        type: urn:videogame-platform:problem:precondition-required
        title: A request precondition is required
        status: 428
        detail: Declare exactly one supported intent precondition.
        instance: urn:videogame-platform:problem-instance:opaque
        code: PRECONDITION_REQUIRED
        category: validation
        correlationId: correlation-opaque
    RateLimitExceeded:
      value:
        type: urn:videogame-platform:problem:rate-limit-exceeded
        title: Rate limit exceeded
        status: 429
        detail: Wait before retrying this request.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATE_LIMIT_EXCEEDED
        category: technical
        correlationId: correlation-opaque
    CatalogueNotReady:
      value:
        type: urn:videogame-platform:problem:catalogue-not-ready
        title: Catalogue is not ready
        status: 503
        detail: No valid local catalogue snapshot has been published yet.
        instance: urn:videogame-platform:problem-instance:opaque
        code: CATALOGUE_NOT_READY
        category: technical
        correlationId: correlation-opaque
    CatalogueReadFailed:
      value:
        type: urn:videogame-platform:problem:catalogue-read-failed
        title: Catalogue read failed
        status: 503
        detail: Local catalogue data cannot currently be read.
        instance: urn:videogame-platform:problem-instance:opaque
        code: CATALOGUE_READ_FAILED
        category: technical
        correlationId: correlation-opaque
    RatingStatisticsReadFailed:
      value:
        type: urn:videogame-platform:problem:rating-statistics-read-failed
        title: Rating statistics read failed
        status: 500
        detail: No coherent game response could be constructed.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_STATISTICS_READ_FAILED
        category: technical
        correlationId: correlation-opaque
    PersonalRatingsReadFailed:
      value:
        type: urn:videogame-platform:problem:personal-ratings-read-failed
        title: Personal ratings read failed
        status: 500
        detail: Personal ratings cannot currently be read consistently.
        instance: urn:videogame-platform:problem-instance:opaque
        code: PERSONAL_RATINGS_READ_FAILED
        category: technical
        correlationId: correlation-opaque
    RatingWriteFailed:
      value:
        type: urn:videogame-platform:problem:rating-write-failed
        title: Rating write failed
        status: 500
        detail: The previous valid personal and aggregate state was preserved.
        instance: urn:videogame-platform:problem-instance:opaque
        code: RATING_WRITE_FAILED
        category: technical
        correlationId: correlation-opaque
    InternalError:
      value:
        type: urn:videogame-platform:problem:internal-error
        title: Internal error
        status: 500
        detail: The request could not be completed.
        instance: urn:videogame-platform:problem-instance:opaque
        code: INTERNAL_ERROR
        category: technical
        correlationId: correlation-opaque
