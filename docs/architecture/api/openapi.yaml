      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            preconditionRequired: { $ref: '#/components/examples/PreconditionRequired' }
    RateLimitExceeded:
      description: An edge abuse limit rejected the request.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
