  /games:
    get:
      tags: [Catalogue]
      operationId: searchGames
      summary: Search the bounded catalogue
      description: |
        Searches canonical titles and approved aliases after trimming. Matching is
        case- and diacritic-insensitive, requires every token, and is non-fuzzy.
        It never calls a provider. Zero and multiple matches are valid outcomes.
        Each result carries a bounded `releaseContext` sample and a separate
        `releaseSummary` computed from every locally stored release of that game.
      security: []
      parameters:
        - $ref: '#/components/parameters/CatalogueQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: A ranked deterministic page of bounded-catalogue games.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSearchPage' }
              examples:
                multipleMatches:
                  summary: Multiple supported games match independently
                  value:
                    items:
                      - gameId: game_resident_evil_4_2005
                        slug: resident-evil-4-2005
                        canonicalTitle: Resident Evil 4
                        matchedAlias: Biohazard 4
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample1.webp
                          alternativeText: Carátula de Resident Evil 4
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/resident-evil-4
                        releaseContext:
                          - platform: { platformId: platform_gamecube, name: Nintendo GameCube }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2005-03-18' }
                            status: released
                            freshnessStatus: fresh
                        releaseSummary:
                          platforms:
                            - { platformId: platform_gamecube, name: Nintendo GameCube }
                            - { platformId: platform_ps2, name: PlayStation 2 }
                            - { platformId: platform_windows, name: Windows PC }
                          totalPlatforms: 7
                          earliestKnownYear: 2005
                          latestKnownYear: 2014
                      - gameId: game_resident_evil_4_2023
                        slug: resident-evil-4-2023
                        canonicalTitle: Resident Evil 4 Remake
                        matchedAlias: Resident Evil 4
                        primaryCover:
                          kind: fallback
                          url: /assets/covers/fallback.svg
                          alternativeText: Carátula oficial no disponible
                          attribution: null
                        releaseContext:
                          - platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: year, value: '2023' }
                            status: released
                            freshnessStatus: stale
                        releaseSummary:
                          platforms:
                            - { platformId: platform_ps5, name: PlayStation 5 }
                          totalPlatforms: 1
                          earliestKnownYear: 2023
                          latestKnownYear: 2023
