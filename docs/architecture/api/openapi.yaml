        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Anonymous or authenticated session state.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
              examples:
                anonymous: { value: { authenticated: false } }
                authenticated:
                  value: { authenticated: true, csrfToken: opaque-csrf-token }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Session]
      operationId: logoutSession
      summary: Terminate the current BFF session
      description: |
        Invalidates the opaque application session. OAuth/OIDC tokens remain
        server-side and are never returned in the response or redirect URL.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The application session is no longer authenticated.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/InternalError' }

