openapi: 3.1.2
info:
  title: VideoGame Platform Learning MVP API
  version: 4.4.0
  summary: Browser-facing API for the approved learning MVP vertical slice.
  description: |
    Provider-independent, same-origin contract for release discovery, a month's release
    calendar, weekly and monthly featured releases, bounded-catalogue search, public game
    details, the selectable platform taxonomy, BFF session discovery, the authenticated user's
    ratings, rating statistics and preferred platforms, and the catalogue operator's
    synchronization status, coverage, bounded synchronization request and the stop or
    abandonment of one run. It contains only the twenty approved method/path operations.

    Authentication navigation under `/auth` and the management-port synchronization, repair
    and localization commands are separate BFF and operational boundaries and are
    intentionally not exposed here. Provider
    image binaries are loaded from an approved CDN reference or replaced by a
    product-owned fallback; this API does not copy, proxy, or redistribute them.
servers:
  - url: /api/v1
    description: Same-origin application deployment
tags:
  - name: Releases
    description: Public release exploration over an inclusive date range.
  - name: Release calendar
    description: Public per-day release counts of one calendar month, from the current month on.
  - name: Featured releases
    description: Public automatic selection of a calendar week's or month's featured releases.
  - name: Catalogue
    description: Public reads from the bounded local catalogue.
  - name: Ratings
    description: Current-user personal-rating reads and commands.
  - name: Platform preferences
    description: |
      The current user's preferred platforms, which the client applies to release discovery as
      an explicit platform filter. Public reads never vary on them.
  - name: Session
    description: Minimal BFF session state without identity or provider tokens.
  - name: Catalogue administration
    description: |
      Catalogue acquisition for sessions holding the catalogue operator authority: reads of
      local run and coverage evidence, a command that requests a bounded synchronization and
      returns before any provider work, and commands that stop or abandon one identified run.
      No operation here waits for, or exposes, the provider.
security: []
paths:
  /releases:
    get:
      tags: [Releases]
      operationId: listReleases
      summary: Explore the releases of an inclusive date range grouped by game
      description: |
        Reads a bounded page of games from the last valid local catalogue publication whose
        releases fall in an inclusive date range. Without `from` and `to`, the range is the
        current calendar week, Monday to Sunday, derived by the application in `Europe/Madrid`;
        the response states the evaluation date and the evaluated range. Each game appears
        once with only the releases that match the range and active filters, presenting at most
        one of them per platform (see `ReleaseItem`); `page.totalItems` counts games, not
        releases.

        Days up to and including the evaluation date hold what has happened: a release with an
        exact day inside the range, or with a month, quarter or year period that has ended and
        overlaps the range, neither cancelled nor delayed. Later days hold what is expected: a
        release with an exact day inside the range that is not cancelled. A month, quarter or year
        period that has not ended joins, not cancelled, only with `includeApproximateDates=true`
        and only when it overlaps the range from the evaluation date on. A release with an unknown
        (TBA) date never belongs to a range. No release receives an invented day, and each keeps
        its real precision.

        Platform and region filters are multi-select: values within one dimension combine with
        OR and the two dimensions combine with AND. `availableFilters` is contextual and
        faceted: platform options reflect the current range and the active region selection
        (never restricted by the active platform set), region options reflect the current range
        and the active platform selection (never restricted by the active region set), and a
        currently selected valid value always stays representable. `sort` orders the games
        before pagination, by date, Hype, community score or external player score; every
        order reads local state only and never calls a provider. Empty, review-required, imprecise-date and fallback-cover results are
        valid states. PostgreSQL groups by game, applies the range and filters, distinct facet
        discovery, presented-release selection, total ordering, count, limit, and offset before
        any release page reaches the application.

        Since 4.0.0, `from`, `to` and `sort` replace the `view` and `weeks` parameters, which are
        now unknown parameters, and the response no longer carries `view`. Migration: a former
        recent window is `to` = today with `from` 7 × weeks − 1 days earlier, a former upcoming
        window runs from today; the order is now one ascending date order whatever the range.
      security: []
      parameters:
        - $ref: '#/components/parameters/ReleaseFrom'
        - $ref: '#/components/parameters/ReleaseTo'
        - $ref: '#/components/parameters/ReleaseSort'
        - $ref: '#/components/parameters/ReleaseIncludeApproximateDates'
        - $ref: '#/components/parameters/PlatformIdsQuery'
        - $ref: '#/components/parameters/RegionIdsQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: A deterministic page of bounded-catalogue games with their matching releases, possibly empty.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/DiscoveryCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
              examples:
                currentWeek:
                  summary: One game grouping several matching releases with differing dates
                  description: |
                    The default range is the current week. Without the opt-in, its days after the
                    evaluation date show only releases with an exact day.
                  value:
                    evaluatedOn: '2026-08-05'
                    window: { from: '2026-08-03', to: '2026-08-09' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_win, name: Windows PC }
                      regions:
                        - { regionId: region_europe, name: Europa }
                        - { regionId: region_worldwide, name: Mundial }
                    items:
                      - gameId: game_silksong
                        slug: hollow-knight-silksong
                        canonicalTitle: Hollow Knight Silksong
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Portada de Hollow Knight Silksong
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/hollow-knight-silksong
                        releases:
                          - releaseId: release_silksong_ps5_eu
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-08-04' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                          - releaseId: release_silksong_win_ww
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-08-06' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                    page: { number: 1, size: 20, totalItems: 1, totalPages: 1 }
                withApproximateDates:
                  summary: Opted-in approximate dates keep their real precision
                  description: |
                    Requested with `from=2026-08-03&to=2026-08-09&includeApproximateDates=true`. A
                    month that has not ended joins beside exact days, after them in the date order,
                    and is never narrowed to an invented day.
                  value:
                    evaluatedOn: '2026-08-05'
                    window: { from: '2026-08-03', to: '2026-08-09' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_win, name: Windows PC }
                      regions:
                        - { regionId: region_europe, name: Europa }
                        - { regionId: region_worldwide, name: Mundial }
                    items:
                      - gameId: game_silksong
                        slug: hollow-knight-silksong
                        canonicalTitle: Hollow Knight Silksong
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Portada de Hollow Knight Silksong
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/hollow-knight-silksong
                        releases:
                          - releaseId: release_silksong_ps5_eu
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-08-04' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                          - releaseId: release_silksong_win_ww
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: month, value: 2026-08 }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                    page: { number: 1, size: 20, totalItems: 1, totalPages: 1 }
                fallbackCover:
                  summary: Last valid local data remains usable with a fallback cover
                  value:
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-07-27', to: '2026-08-02' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_switch, name: Nintendo Switch }
                      regions:
                        - { regionId: region_europe, name: Europa }
                    items:
                      - gameId: game_example
                        slug: juego-de-ejemplo
                        canonicalTitle: Juego de ejemplo
                        primaryCover:
                          kind: fallback
                          url: /assets/covers/fallback.svg
                          alternativeText: Portada oficial no disponible
                          attribution: null
                        releases:
                          - releaseId: release_example_switch_eu
                            stage: unknown
                            gameId: game_example
                            platform: { platformId: platform_switch, name: Nintendo Switch }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-07-28' }
                            status: released
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-05-01T09:00:00Z'
                            lastVerifiedAt: '2026-05-02T05:10:00Z'
                            verificationLevel: verified
                            reviewStatus: required
                    page: { number: 1, size: 20, totalItems: 1, totalPages: 1 }
                empty:
                  summary: No release matches the active filters
                  value:
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-08-01', to: '2026-08-31' }
                    activeFilters: { platformIds: [platform_ps5], regionIds: [region_europe] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                      regions:
                        - { regionId: region_europe, name: Europa }
                    items: []
                    page: { number: 1, size: 20, totalItems: 0, totalPages: 0 }
        '304': { $ref: '#/components/responses/PublicNotModified' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ReleaseValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CatalogueUnavailable' }

  /release-calendar:
    get:
      tags: [Release calendar]
      operationId: getReleaseCalendar
      summary: Count highlighted games releasing on each day of one calendar month
      description: |
        Reads, from the last valid local catalogue publication, how many games release on each
        day of one calendar month, for a monthly calendar. Without `month` the current month in
        `Europe/Madrid` is served. Navigation never goes back: a month must lie between the
        current month and the last calendar month lying entirely inside the configured forward
        acquisition horizon, the same forward bound featured months use; the current month is
        always accepted. The bound states what acquisition is configured to cover, never that the
        local catalogue is complete.

        This is the highlights calendar: only games with locally stored IGDB Hypes >= 10
        qualify; missing or lower Hype is excluded. The threshold is fixed, not a percentile
        recomputed per request. It filters contextual facets as well as day counts.

        The calendar is active from the evaluation date on: days of the month before it are
        never counted. A day holds only releases with that exact day, under the release
        explorer's own rules (`GET /releases`): never cancelled, and on the evaluation date not
        delayed either. `days` lists each day from the evaluation date (or the month's first day,
        for a later month) to the month's last day holding at least one such release that matches
        the active filters, in ascending order; a day without one is absent.
        `totalHype` is the sum of local Hypes of the qualifying games on that day, counting each
        game once regardless of how many matching platforms or regions it has. The sum uses the
        same active filters as `gameCount` and excludes games below the highlights threshold.
        `gameCount` counts games, not releases: a game releasing on several platforms or regions that day
        counts once. The full explorer lists every qualifying release of that day without a
        highlights restriction, so its `page.totalItems` may exceed the calendar's `gameCount`.
        The calendar preview reads the leading games from `GET /releases` with `sort=hype` and
        a page size capped by both three and the day's highlighted-game count.

        A release known only to its month, quarter or year, or with an unknown (TBA) date, never
        belongs to a day and is not counted; nothing is attributed to an invented day or month.

        Platform and region filters, `activeFilters` and the contextual, faceted
        `availableFilters` follow `GET /releases`, evaluated over every release the calendar
        counts. PostgreSQL applies the filters, groups and counts; the response holds at most 31
        days, and no game page is read. No provider is called, and the
        representation never varies on a session.
      security: []
      parameters:
        - $ref: '#/components/parameters/ReleaseCalendarMonth'
        - $ref: '#/components/parameters/PlatformIdsQuery'
        - $ref: '#/components/parameters/RegionIdsQuery'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: The month's per-day game counts, possibly without any day.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/DiscoveryCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseCalendar' }
              examples:
                currentMonth:
                  summary: The current month, counted from today
                  description: |
                    No `month` was requested, so the current month in `Europe/Madrid` is served.
                    It is the first month, so `previous` is absent, and days before 21 October
                    are not counted.
                  value:
                    month: 2026-10
                    evaluatedOn: '2026-10-21'
                    window: { from: '2026-10-01', to: '2026-10-31' }
                    navigation: { first: 2026-10, last: 2027-03, next: 2026-11 }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_win, name: Windows PC }
                      regions:
                        - { regionId: region_europe, name: Europa }
                        - { regionId: region_worldwide, name: Mundial }
                    days:
                      - { date: '2026-10-21', gameCount: 1, totalHype: 20 }
                      - { date: '2026-10-23', gameCount: 3, totalHype: 60 }
                      - { date: '2026-10-30', gameCount: 12, totalHype: 240 }
                filteredFutureMonth:
                  summary: A later month filtered by platform
                  description: Requested with `month=2027-02&platformIds=platform_ps5`.
                  value:
                    month: 2027-02
                    evaluatedOn: '2026-10-21'
                    window: { from: '2027-02-01', to: '2027-02-28' }
                    navigation: { first: 2026-10, last: 2027-03, previous: 2027-01, next: 2027-03 }
                    activeFilters: { platformIds: [platform_ps5], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_switch, name: Nintendo Switch }
                      regions:
                        - { regionId: region_worldwide, name: Mundial }
                    days:
                      - { date: '2027-02-26', gameCount: 2, totalHype: 40 }
                empty:
                  summary: The last month inside the horizon holds nothing yet
                  value:
                    month: 2027-03
                    evaluatedOn: '2026-10-21'
                    window: { from: '2027-03-01', to: '2027-03-31' }
                    navigation: { first: 2026-10, last: 2027-03, previous: 2027-02 }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters: { platforms: [], regions: [] }
                    days: []
        '304': { $ref: '#/components/responses/PublicNotModified' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ReleaseCalendarValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CatalogueUnavailable' }

  /featured-releases:
    get:
      tags: [Featured releases]
      operationId: getFeaturedReleases
      summary: Read the automatic featured releases of one calendar week or month
      description: |
        Reads the automatic selection of one calendar period from the last valid local catalogue:
        an ISO 8601 week, Monday to Sunday, or a calendar month. Candidates are the games with a
        qualifying commercial release inside the period: its known date period lies entirely
        inside it (an exact day of the period, or, for a month, month precision equal to the
        month) and it is neither cancelled, delayed, nor pending review. A week therefore only
        ever holds day-precision releases; a month, quarter, year or unknown date is never
        assigned to a week. Only Full Release participates. A candidate must be an accepted
        import type, not an edition, with its own known first release in this period and
        positive locally stored IGDB Hypes. Candidates rank by Hypes descending, then `gameId`
        ascending. A game without a usable popularity signal stays a normal catalogue and
        discovery result but is not ranked, and no popularity value is ever invented. The first
        item is the period's featured release and up to five more follow; fewer items are
        returned rather than filling slots. Popularity measures provider-observed attention,
        never quality, a rating, or an editorial recommendation, and the signal value itself is
        not exposed. The application derives the evaluation date, the current week and the
        current month in `Europe/Madrid`. Without parameters the current calendar month is
        served. Any period inside the navigation bounds may be selected; it is ranked with the
        same current local popularity evidence, because no popularity history is kept. Weeks
        reach 16 weeks before and after the current week. Months reach 10 calendar months back,
        across years, and forward to the last calendar month lying entirely inside the
        configured forward horizon of catalogue acquisition; the bound states what acquisition
        is configured to cover, never that the local catalogue is complete. `navigation` names
        the adjacent periods inside these bounds. PostgreSQL selects the
        qualifying releases, ranks and limits the games, and presents at most one release per
        platform before anything reaches the application. Each item also carries the landscape
        context-selected image and optional decorative secondary-card logo,
        chosen from locally stored provider media metadata and delivered as approved direct CDN
        references (ADR-0001). Up to two product-owned localized genres accompany each item;
        only the first item carries the existing localized summary representation. All content
        is served from PostgreSQL; no provider or translator is called.

        Since 4.1.0, `platformIds` restricts the candidates before they are ranked: only a
        qualifying release on one of the named platforms makes its game a candidate, and each
        item presents only those releases. The ranking, its limit and its tie-breaker are
        unchanged, so a restricted selection is the ranking of the restricted candidates, never
        a filtered copy of the unrestricted six. The selection states `no_qualifying_releases`
        when none of the named platforms has a qualifying release in the period. Without
        `platformIds` the selection is unchanged. The representation depends only on the
        request's explicit parameters, never on a session.
      security: []
      parameters:
        - $ref: '#/components/parameters/FeaturedGranularity'
        - $ref: '#/components/parameters/FeaturedWeek'
        - $ref: '#/components/parameters/FeaturedMonth'
        - $ref: '#/components/parameters/FeaturedPlatformIdsQuery'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: The period's featured selection, possibly empty.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/DiscoveryCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeaturedReleases' }
              examples:
                ranked:
                  summary: A featured release of the month followed by another featured release
                  description: |
                    The current month in `Europe/Madrid`. Up to five other featured releases may
                    follow the first item; this example shows one. The first game presents a wide
                    artwork and optional logo metadata (the hero title stays text); the second has no usable artwork or screenshot, so its
                    provider cover is shown whole.
                  value:
                    granularity: month
                    month: 2026-10
                    evaluatedOn: '2026-10-03'
                    window: { from: '2026-10-01', to: '2026-10-31' }
                    navigation: { previous: 2026-09, next: 2026-11 }
                    selection:
                      status: ranked
                      popularityFreshness: fresh
                      popularityObservedAt: '2026-10-02T05:00:00Z'
                    items:
                      - gameId: game_featured_example
                        slug: juego-destacado-de-ejemplo
                        canonicalTitle: Juego destacado de ejemplo
                        genres:
                          - { genreId: adventure, name: Aventura }
                          - { genreId: role-playing, name: Rol (RPG) }
                        summary:
                          kind: sourced
                          text: Explora un mundo abierto y descubre sus historias.
                          language: es
                          provenance: { sourceKind: external_provider, sourceName: IGDB, sourceEntityType: game }
                          translation:
                            kind: machine_translation
                            sourceText: Explore an open world and discover its stories.
                            sourceLanguage: en
                            current: true
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Portada de Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        featuredImage:
                          kind: artwork
                          presentation: fill
                          url: https://images.igdb.com/igdb/image/upload/t_1080p/arexample.webp
                          compactUrl: https://images.igdb.com/igdb/image/upload/t_720p/arexample.webp
                          alternativeText: Arte de Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        logo:
                          url: https://images.igdb.com/igdb/image/upload/t_720p/loexample.png
                          alternativeText: Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        releases:
                          - releaseId: release_featured_ps5_ww
                            stage: full_release
                            gameId: game_featured_example
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-10-15' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-09-30T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                          - releaseId: release_featured_win_ww
                            stage: full_release
                            gameId: game_featured_example
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-10-15' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-09-30T08:10:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                      - gameId: game_featured_month
                        slug: lanzamiento-de-mes-aproximado
                        canonicalTitle: Lanzamiento de mes aproximado
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/comonth.webp
                          alternativeText: Portada de Lanzamiento de mes aproximado
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/lanzamiento-de-mes-aproximado
                        featuredImage:
                          kind: cover
