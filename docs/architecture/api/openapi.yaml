            ratingNotEligible: { $ref: '#/components/examples/RatingNotEligible' }
            releaseReviewRequired: { $ref: '#/components/examples/ReleaseDataReviewRequired' }
            propertyUnknown: { $ref: '#/components/examples/RequestPropertyUnknown' }
    ReleaseReviewBlocked:
      description: Release evidence requires review and no coherent safe game response can be constructed.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
        Cache-Control: { $ref: '#/components/headers/NoStoreCacheControl' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            releaseReviewRequired: { $ref: '#/components/examples/ReleaseDataReviewRequired' }
    PreconditionRequired:
      description: The required create, update, or delete precondition is missing or contradictory.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
