openapi: 3.1.2
info:
  title: VideoGame Platform Learning MVP API
  version: 3.7.0
  summary: Browser-facing API for the approved learning MVP vertical slice.
  description: |
    Provider-independent, same-origin contract for release discovery, monthly featured
    releases, bounded-catalogue search, public game details, BFF session discovery, and the
    authenticated user's ratings. It contains only the ten approved method/path operations.

    Authentication navigation under `/auth` and catalogue synchronization are separate
    BFF and operational boundaries and are intentionally not exposed here. Provider
    image binaries are loaded from an approved CDN reference or replaced by a
    product-owned fallback; this API does not copy, proxy, or redistribute them.
servers:
  - url: /api/v1
    description: Same-origin application deployment
tags:
  - name: Releases
    description: Public recent and upcoming release discovery.
  - name: Featured releases
    description: Public automatic selection of a calendar month's featured releases.
  - name: Catalogue
    description: Public reads from the bounded local catalogue.
  - name: Ratings
    description: Current-user personal-rating reads and commands.
  - name: Session
    description: Minimal BFF session state without identity or provider tokens.
security: []
paths:
  /releases:
    get:
      tags: [Releases]
      operationId: listReleases
      summary: Browse recent or upcoming releases grouped by game
      description: |
        Reads a bounded page of games from the last valid local catalogue publication. Each
        game appears once with only the releases that match the requested view and active
        filters, presenting at most one of them per platform (see `ReleaseItem`);
        `page.totalItems` counts games, not releases. Platform and region filters are
        multi-select: values within one dimension combine with OR and the two dimensions combine
        with AND. `availableFilters` is contextual and faceted: platform options reflect the
        current view/window and the active region selection (never restricted by the active
        platform set), region options reflect the current view/window and the active platform
        selection (never restricted by the active region set), and a currently selected valid
        value always stays representable. The application derives the evaluation date and the
        selected bounded week window in `Europe/Madrid`. Upcoming discovery returns only releases
        with an exact day unless `includeApproximateDates=true` also admits month, quarter, year,
        and unknown (TBA) precision; the precision choice composes with the window and both filter
        dimensions, and the facets reflect it. Empty, stale, review-required, imprecise-date, TBA,
        and fallback-cover results are valid states. PostgreSQL groups by game, applies filters,
        distinct facet discovery, presented-release selection, total ordering, count, limit, and
        offset before any release page reaches the application.
      security: []
      parameters:
        - $ref: '#/components/parameters/ReleaseView'
        - $ref: '#/components/parameters/ReleaseWeeks'
        - $ref: '#/components/parameters/ReleaseIncludeApproximateDates'
        - $ref: '#/components/parameters/PlatformIdsQuery'
        - $ref: '#/components/parameters/RegionIdsQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: A deterministic page of bounded-catalogue games with their matching releases, possibly empty.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
              examples:
                upcoming:
                  summary: One game grouping several matching releases with differing dates
                  description: Default upcoming discovery returns only releases with an exact day.
                  value:
                    view: upcoming
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-07-31', to: '2026-08-07' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_win, name: Windows PC }
                      regions:
                        - { regionId: region_europe, name: Europa }
                        - { regionId: region_worldwide, name: Mundial }
                    items:
                      - gameId: game_silksong
                        slug: hollow-knight-silksong
                        canonicalTitle: Hollow Knight Silksong
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Carátula de Hollow Knight Silksong
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/hollow-knight-silksong
                        releases:
                          - releaseId: release_silksong_ps5_eu
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-08-04' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            lastSyncedAt: '2026-07-30T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                          - releaseId: release_silksong_win_ww
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-08-06' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            lastSyncedAt: '2026-07-30T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                    page: { number: 1, size: 20, totalItems: 1, totalPages: 1 }
                upcomingWithApproximateDates:
                  summary: Opted-in approximate dates keep their real precision
                  description: |
                    Requested with `includeApproximateDates=true`. Month, quarter, year, and unknown
                    (TBA) precision follow exact days in the upcoming order and are never narrowed
                    to an invented day.
                  value:
                    view: upcoming
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-07-31', to: '2026-08-07' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                        - { platformId: platform_win, name: Windows PC }
                      regions:
                        - { regionId: region_europe, name: Europa }
                        - { regionId: region_worldwide, name: Mundial }
                    items:
                      - gameId: game_silksong
                        slug: hollow-knight-silksong
                        canonicalTitle: Hollow Knight Silksong
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Carátula de Hollow Knight Silksong
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/hollow-knight-silksong
                        releases:
                          - releaseId: release_silksong_ps5_eu
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-08-04' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            lastSyncedAt: '2026-07-30T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                          - releaseId: release_silksong_win_ww
                            stage: unknown
                            gameId: game_silksong
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: month, value: 2026-08 }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            lastSyncedAt: '2026-07-30T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                      - gameId: game_example_tba
                        slug: juego-por-confirmar
                        canonicalTitle: Juego por confirmar
                        primaryCover:
                          kind: fallback
                          url: /assets/covers/fallback.svg
                          alternativeText: Carátula oficial no disponible
                          attribution: null
                        releases:
                          - releaseId: release_example_tba_win_ww
                            stage: unknown
                            gameId: game_example_tba
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: unknown, value: null }
                            status: announced
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-07-25T08:10:00Z'
                            lastSyncedAt: '2026-07-30T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                    page: { number: 1, size: 20, totalItems: 2, totalPages: 1 }
                staleWithFallback:
                  summary: Last valid stale data remains usable with a fallback cover
                  value:
                    view: recent
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-07-25', to: '2026-07-31' }
                    activeFilters: { platformIds: [], regionIds: [] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_switch, name: Nintendo Switch }
                      regions:
                        - { regionId: region_europe, name: Europa }
                    items:
                      - gameId: game_example
                        slug: juego-de-ejemplo
                        canonicalTitle: Juego de ejemplo
                        primaryCover:
                          kind: fallback
                          url: /assets/covers/fallback.svg
                          alternativeText: Carátula oficial no disponible
                          attribution: null
                        releases:
                          - releaseId: release_example_switch_eu
                            stage: unknown
                            gameId: game_example
                            platform: { platformId: platform_switch, name: Nintendo Switch }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-07-28' }
                            status: released
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release
                            providerUpdatedAt: '2026-05-01T09:00:00Z'
                            lastSyncedAt: '2026-05-02T05:00:00Z'
                            lastVerifiedAt: '2026-05-02T05:10:00Z'
                            verificationLevel: verified
                            reviewStatus: required
                            freshnessStatus: stale
                    page: { number: 1, size: 20, totalItems: 1, totalPages: 1 }
                empty:
                  summary: No release matches the active filters
                  value:
                    view: upcoming
                    evaluatedOn: '2026-07-31'
                    window: { from: '2026-07-31', to: '2026-08-07' }
                    activeFilters: { platformIds: [platform_ps5], regionIds: [region_europe] }
                    availableFilters:
                      platforms:
                        - { platformId: platform_ps5, name: PlayStation 5 }
                      regions:
                        - { regionId: region_europe, name: Europa }
                    items: []
                    page: { number: 1, size: 20, totalItems: 0, totalPages: 0 }
        '304': { $ref: '#/components/responses/PublicNotModified' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ReleaseValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CatalogueUnavailable' }

  /featured-releases:
    get:
      tags: [Featured releases]
      operationId: getFeaturedReleases
      summary: Read the automatic featured releases of one calendar month
      description: |
        Reads the automatic selection of one calendar month from the last valid local catalogue.
        Candidates are the games with a qualifying commercial release inside the month: its known
        date lies inside the month (an exact day of the month, or month precision equal to the
        month) and it is neither cancelled, delayed, nor pending review. Only Full Release
        participates. A candidate must be an accepted import type, not an edition, with its
        own known first release in this month and positive locally stored IGDB Hypes.
        Candidates rank by Hypes descending, then `gameId` ascending. A
        game without a usable popularity signal stays a normal catalogue and discovery result but
        is not ranked, and no popularity value is ever invented. The first item is the month's
        featured release and up to five more follow; fewer items are returned rather than filling
        slots. Popularity measures provider-observed attention, never quality, a rating, or an
        editorial recommendation, and the signal value itself is not exposed. The application
        derives the evaluation date and the default month, the current calendar month, in
        `Europe/Madrid`. Another month of the current calendar year may be selected; it is ranked
        with the same current local popularity evidence, because no popularity history is kept.
        A month of another year is never featured. PostgreSQL selects the
        qualifying releases, ranks and limits the games, and presents at most one release per
        platform before anything reaches the application. Each item also carries the landscape
        context-selected image and optional decorative secondary-card logo,
        chosen from locally stored provider media metadata and delivered as approved direct CDN
        references (ADR-0001). Up to two product-owned localized genres accompany each item;
        only the first item carries the existing localized summary representation. All content
        is served from PostgreSQL; no provider or translator is called.
      security: []
      parameters:
        - $ref: '#/components/parameters/FeaturedMonth'
        - $ref: '#/components/parameters/PublicIfNoneMatch'
      responses:
        '200':
          description: The month's featured selection, possibly empty.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/XCorrelationId' }
            Cache-Control: { $ref: '#/components/headers/PublicCacheControl' }
            ETag: { $ref: '#/components/headers/PublicEntityTag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeaturedReleases' }
              examples:
                ranked:
                  summary: A featured release of the month followed by another featured release
                  description: |
                    The current month in `Europe/Madrid`. Up to five other featured releases may
                    follow the first item; this example shows one. The first game presents a wide
                    artwork and optional logo metadata (the hero title stays text); the second has no usable artwork or screenshot, so its
                    provider cover is shown whole.
                  value:
                    month: 2026-10
                    evaluatedOn: '2026-10-03'
                    window: { from: '2026-10-01', to: '2026-10-31' }
                    selection:
                      status: ranked
                      popularityFreshness: fresh
                      popularityObservedAt: '2026-10-02T05:00:00Z'
                    items:
                      - gameId: game_featured_example
                        slug: juego-destacado-de-ejemplo
                        canonicalTitle: Juego destacado de ejemplo
                        genres:
                          - { genreId: adventure, name: Aventura }
                          - { genreId: role-playing, name: Rol (RPG) }
                        summary:
                          kind: sourced
                          text: Explora un mundo abierto y descubre sus historias.
                          language: es
                          provenance: { sourceKind: external_provider, sourceName: IGDB, sourceEntityType: game }
                          translation:
                            kind: machine_translation
                            sourceText: Explore an open world and discover its stories.
                            sourceLanguage: en
                            current: true
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coexample.webp
                          alternativeText: Carátula de Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        featuredImage:
                          kind: artwork
                          presentation: fill
                          url: https://images.igdb.com/igdb/image/upload/t_1080p/arexample.webp
                          compactUrl: https://images.igdb.com/igdb/image/upload/t_720p/arexample.webp
                          alternativeText: Arte de Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        logo:
                          url: https://images.igdb.com/igdb/image/upload/t_720p/loexample.png
                          alternativeText: Juego destacado de ejemplo
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/juego-destacado-de-ejemplo
                        releases:
                          - releaseId: release_featured_ps5_ww
                            stage: full_release
                            gameId: game_featured_example
                            platform: { platformId: platform_ps5, name: PlayStation 5 }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-10-15' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-09-30T08:10:00Z'
                            lastSyncedAt: '2026-10-02T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                          - releaseId: release_featured_win_ww
                            stage: full_release
                            gameId: game_featured_example
                            platform: { platformId: platform_win, name: Windows PC }
                            region: { regionId: region_worldwide, name: Mundial }
                            releaseDate: { precision: day, value: '2026-10-15' }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-09-30T08:10:00Z'
                            lastSyncedAt: '2026-10-02T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                      - gameId: game_featured_month
                        slug: lanzamiento-de-mes-aproximado
                        canonicalTitle: Lanzamiento de mes aproximado
                        primaryCover:
                          kind: provider
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/comonth.webp
                          alternativeText: Carátula de Lanzamiento de mes aproximado
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/lanzamiento-de-mes-aproximado
                        featuredImage:
                          kind: cover
                          presentation: contain
                          url: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/comonth.webp
                          compactUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/comonth.webp
                          alternativeText: Carátula de Lanzamiento de mes aproximado
                          attribution:
                            label: IGDB
                            sourceUrl: https://www.igdb.com/games/lanzamiento-de-mes-aproximado
                        releases:
                          - releaseId: release_featured_month_switch_eu
                            stage: unknown
                            gameId: game_featured_month
                            platform: { platformId: platform_switch, name: Nintendo Switch }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: month, value: 2026-10 }
                            status: scheduled
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-09-12T08:10:00Z'
                            lastSyncedAt: '2026-10-02T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: fresh
                stalePopularity:
                  summary: The last valid local ranking with stale popularity evidence
                  description: |
                    A visitor selected September 2026. The ranking is still served from the last
                    valid local popularity evidence, whose oldest acquisition is older than the
                    catalogue freshness policy.
                  value:
                    month: 2026-09
                    evaluatedOn: '2026-10-03'
                    window: { from: '2026-09-01', to: '2026-09-30' }
                    selection:
                      status: ranked
                      popularityFreshness: stale
                      popularityObservedAt: '2026-09-02T05:00:00Z'
                    items:
                      - gameId: game_example
                        slug: juego-de-ejemplo
                        canonicalTitle: Juego de ejemplo
                        primaryCover:
                          kind: fallback
                          url: /assets/covers/fallback.svg
                          alternativeText: Carátula oficial no disponible
                          attribution: null
                        featuredImage:
                          kind: fallback
                          presentation: fill
                          url: /assets/featured/fallback.svg
                          compactUrl: /assets/featured/fallback.svg
                          alternativeText: Imagen destacada no disponible de Juego de ejemplo
                          attribution: null
                        releases:
                          - releaseId: release_example_switch_eu
                            stage: unknown
                            gameId: game_example
                            platform: { platformId: platform_switch, name: Nintendo Switch }
                            region: { regionId: region_europe, name: Europa }
                            releaseDate: { precision: day, value: '2026-09-18' }
                            status: released
                            provenance:
                              sourceKind: external_provider
                              sourceName: IGDB
                              sourceEntityType: release_date
                            providerUpdatedAt: '2026-08-20T09:00:00Z'
                            lastSyncedAt: '2026-09-02T05:00:00Z'
                            verificationLevel: provider_only
                            reviewStatus: not_required
                            freshnessStatus: stale
                popularityUnavailable:
                  summary: Qualifying releases exist but none has a popularity signal
                  value:
                    month: 2026-11
                    evaluatedOn: '2026-10-03'
                    window: { from: '2026-11-01', to: '2026-11-30' }
                    selection: { status: popularity_unavailable }
                    items: []
                noQualifyingReleases:
                  summary: The local catalogue holds no qualifying release in the month
                  value:
                    month: 2026-12
                    evaluatedOn: '2026-10-03'
                    window: { from: '2026-12-01', to: '2026-12-31' }
